<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greenwood 100 Directory</title>
</head>
<body style="font-family: sans-serif; margin: 40px;">
  <h1>Greenwood 100 Business Directory</h1>
  <form id="bizForm" style="display:flex; flex-direction:column; gap:10px; max-width:400px;">
    <input name="name" placeholder="Business Name" required />
    <input name="phone" placeholder="Phone" required />
    <input name="email" type="email" placeholder="Email" required />
    <input name="referralProgram" placeholder="Referral Program (e.g., 10% or $50)" />
    <select name="investorWanted">
      <option value="no">Investor Wanted: No</option>
      <option value="yes">Investor Wanted: Yes</option>
    </select>
    <label><input type="checkbox" name="verified" /> Verified</label>
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById('bizForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.currentTarget);
      const payload = {
        name: fd.get('name'),
        phone: fd.get('phone'),
        email: fd.get('email'),
        referralProgram: fd.get('referralProgram'),
        investorWanted: fd.get('investorWanted') === 'yes',
        verified: fd.get('verified') === 'on'
      };

      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert('✅ Saved to Google Sheet!');
        e.currentTarget.reset();
      } else {
        const err = await res.json().catch(() => ({}));
        alert(err.error || '❌ Failed to save. Try again.');
      }
    });
  </script>
</body>
</html>
