<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Greenwood 100 Business Directory</title>
  <!-- Optional: Tailwind CDN for quick styling; remove if you have your own CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-2xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Greenwood 100 Business Directory</h1>

    <!-- FORM -->
    <form id="businessForm" class="space-y-4 bg-white p-6 rounded-lg shadow">
      <input name="name" placeholder="Business Name" required class="w-full border rounded px-3 py-2" />
      <input name="phone" placeholder="Phone" class="w-full border rounded px-3 py-2" />
      <input type="email" name="email" placeholder="Email" required class="w-full border rounded px-3 py-2" />
      <input name="referralProgram" placeholder="Referral Program (e.g., 10% or $50)" class="w-full border rounded px-3 py-2" />

      <select name="investorWanted" class="w-full border rounded px-3 py-2">
        <option value="No" selected>Investor Wanted: No</option>
        <option value="Yes">Investor Wanted: Yes</option>
      </select>

      <label class="flex items-center gap-2">
        <input type="checkbox" name="verified" class="h-4 w-4" />
        <span>Verified</span>
      </label>

      <button type="submit" class="w-full bg-emerald-600 text-white font-semibold py-2 rounded hover:bg-emerald-700">
        Submit
      </button>
    </form>

    <!-- Success/Fail messages -->
    <div id="msg" class="mt-4 hidden"></div>
  </main>

  <script>
    const form = document.getElementById('businessForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'mt-4 hidden'; msg.textContent = '';

      const fd = new FormData(form);
      const payload = {
        name: fd.get('name') || '',
        phone: fd.get('phone') || '',
        email: fd.get('email') || '',
        referralProgram: fd.get('referralProgram') || '',
        investorWanted: (fd.get('investorWanted') || 'No') === 'Yes',
        verified: !!fd.get('verified'),
      };

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (res.ok && data.ok) {
          form.reset();
          msg.textContent = 'Submitted! We’ll be in touch soon.';
          msg.className = 'mt-4 p-3 rounded bg-green-100 text-green-800';
        } else {
          msg.textContent = 'Submission failed: ' + (data.error || 'Unknown error');
          msg.className = 'mt-4 p-3 rounded bg-red-100 text-red-800';
        }
      } catch (err) {
        console.error(err);
        msg.textContent = 'Network error. Please try again.';
        msg.className = 'mt-4 p-3 rounded bg-red-100 text-red-800';
      }
    });
  </script>
</body>
</html>
